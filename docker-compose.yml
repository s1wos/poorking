services:
  app:
    build:
      context: ./docker/php
    container_name: booking_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: booking
      DB_USERNAME: root
      DB_PASSWORD: root

  node:
    image: node:18-alpine
    container_name: booking_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: booking_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: booking_db
    environment:
      MYSQL_DATABASE: booking
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbdata:



